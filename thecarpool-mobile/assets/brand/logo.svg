<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- TheCarPool brand badge: three riders sharing a car over a road swoosh. -->
  <defs>
    <clipPath id="inner"><circle cx="512" cy="512" r="396"/></clipPath>
  </defs>

  <!-- Outer ring -->
  <circle cx="512" cy="512" r="470" fill="#2B6CB0"/>
  <circle cx="512" cy="512" r="426" fill="#FFFFFF"/>
  <circle cx="512" cy="512" r="396" fill="#45C4BC"/>

  <g clip-path="url(#inner)">
    <!-- Lower interior: soft white ground -->
    <path d="M60 640 Q512 540 964 660 L964 960 L60 960 Z" fill="#EAF4F8"/>

    <!-- Road swoosh -->
    <path d="M40 980 Q420 760 980 700 L980 790 Q470 830 130 1010 Z" fill="#E87722"/>
    <path d="M300 872 Q560 780 900 750" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-dasharray="52 44"/>

    <!-- Car body -->
    <g stroke="#FFFFFF" stroke-width="22" stroke-linejoin="round">
      <path d="M240 560
               Q244 500 300 488
               L672 470
               Q760 466 800 530
               L830 560
               Q862 566 862 606
               L858 646
               Q856 672 828 672
               L262 672
               Q236 672 236 644
               Z" fill="#1E4E8C"/>
    </g>
    <!-- Windshield hint -->
    <path d="M700 492 Q756 492 788 542 L706 546 Z" fill="#8FC7E8"/>

    <!-- Wheels -->
    <g>
      <circle cx="352" cy="676" r="58" fill="#FFFFFF"/>
      <circle cx="352" cy="676" r="34" fill="#1E4E8C"/>
      <circle cx="712" cy="676" r="58" fill="#FFFFFF"/>
      <circle cx="712" cy="676" r="34" fill="#1E4E8C"/>
    </g>

    <!-- Forward arrow on the door -->
    <path d="M560 600 L640 600 L640 580 L688 612 L640 644 L640 624 L560 624 Z" fill="#45C4BC"/>

    <!-- Riders: blue, orange, green -->
    <g stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round">
      <!-- Blue rider (left) -->
      <circle cx="340" cy="360" r="62" fill="#3B82C4"/>
      <path d="M268 500 Q268 420 340 420 Q412 420 412 500 L412 520 L268 520 Z" fill="#3B82C4"/>
      <!-- Orange rider (middle, slightly taller) -->
      <circle cx="500" cy="330" r="66" fill="#F08A24"/>
      <path d="M424 486 Q424 402 500 402 Q576 402 576 486 L576 512 L424 512 Z" fill="#F08A24"/>
      <!-- Green rider (right) -->
      <circle cx="656" cy="360" r="62" fill="#7AB648"/>
      <path d="M584 500 Q584 420 656 420 Q728 420 728 500 L728 516 L584 516 Z" fill="#7AB648"/>
    </g>

    <!-- Smiles + eyes -->
    <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M316 376 Q340 396 364 376"/>
      <path d="M474 348 Q500 370 526 348"/>
      <path d="M632 376 Q656 396 680 376"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="318" cy="346" r="9"/><circle cx="362" cy="346" r="9"/>
      <circle cx="476" cy="314" r="9"/><circle cx="524" cy="314" r="9"/>
      <circle cx="634" cy="346" r="9"/><circle cx="678" cy="346" r="9"/>
    </g>
  </g>
</svg>
